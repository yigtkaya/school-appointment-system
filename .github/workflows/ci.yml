name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # ====================================
  # DOCKER BUILD
  # ====================================
  docker-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      working-directory: ./backend
      run: |
        docker build -f deployment/Dockerfile -t school-appointment-api:latest .

  # ====================================
  # DEPLOYMENT (Production) - Hetzner Server
  # ====================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Hetzner Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        password: ${{ secrets.PRODUCTION_PASSWORD }}
        script: |
          cd /opt/school-appointment-system

          echo "📥 Pulling latest code..."
          git pull origin main

          echo "🐳 Rebuilding Docker containers..."
          cd backend
          docker compose -f deployment/docker-compose.prod.yml build --no-cache

          echo "🔄 Restarting services..."
          docker compose -f deployment/docker-compose.prod.yml up -d

          echo "⏳ Waiting for services to start..."
          sleep 20

          echo "🗄️ Running database migrations..."
          docker compose -f deployment/docker-compose.prod.yml exec -T api alembic upgrade head

          echo "🧹 Cleaning up old Docker resources..."
          docker system prune -f

          echo "✅ Deployment completed successfully!"

    - name: Health Check
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        password: ${{ secrets.PRODUCTION_PASSWORD }}
        script: |
          echo "🏥 Running health check..."
          sleep 5
          curl -f http://localhost:8000/health || (echo "❌ Health check failed!" && exit 1)
          echo "✅ Health check passed!"